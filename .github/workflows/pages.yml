# Builds the browser player and publishes it to GitHub Pages.
# Needs Settings > Pages > Source set to "GitHub Actions".
name: Web player

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-web -j
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build-web/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
